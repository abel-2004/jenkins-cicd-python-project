
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "flask-app"
        metrics_path: /metrics

        kubernetes_sd_configs:
          - role: endpoints

        relabel_configs:
          - source_labels:
              [__meta_kubernetes_namespace]
            action: keep
            regex: default

          - source_labels:
              [__meta_kubernetes_service_name]
            action: keep
            regex: jenkins-cicd-service

          - source_labels:
              [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
