
apiVersion: apps/v1
kind: Deployment

metadata:
  name: jenkins-cicd-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: jenkins-cicd-app

  template:
    metadata:
      labels:
        app: jenkins-cicd-app

    spec:
      containers:
        - name: flask-app
          image: jenkins-cicd-python:2.0
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
